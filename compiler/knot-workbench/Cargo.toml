[package]
name = "knot-workbench"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[features]
cost-accounting = ["twine/cost-accounting"]
compact-captures = ["twine/compact-captures"]
incremental = ["twine/incremental"]

[dependencies]
knot-syntax = { path = "../knot-syntax" }
knot-canonical = { path = "../knot-canonical" }
knot-checker = { path = "../knot-checker" }
knot-core = { path = "../knot-core" }
twine = { path = "../twine" }

serde = { version = "1", features = ["derive"] }
bincode = "1.3.3"

[dev-dependencies]
serde_json = "1"
