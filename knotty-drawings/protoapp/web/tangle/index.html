<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tangle · Definition editor</title>
    <link rel="stylesheet" href="/tangle.css" />
    <script src="/tangle.js" defer></script>
  </head>
  <body>
    <header>
      <strong class="brand">Tangle</strong><span class="slash">/</span><span id="module"></span>
      <div class="actions">
        <a id="gallery-link" href="/tangle/stories">Syntax storybook</a>
        <button id="undo">Undo</button><button id="save" class="primary">Save</button>
      </div>
    </header>
    <main>
      <nav id="stories" aria-label="Syntax stories" hidden></nav>
      <section class="workspace">
        <div class="toolbar">
          <select id="choose-definition" aria-label="Drawing definition" hidden></select>
          <h1 id="definition">Definition graph</h1>
          <button id="fit">Fit graph</button>
        </div>
        <div id="viewport" aria-label="Definition graph">
          <div id="extent">
            <div id="board"><svg id="wires" aria-hidden="true">
              <defs>
                <marker id="call-tip" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 8 8"
                        markerWidth="8" markerHeight="8" refX="15" refY="4" overflow="visible">
                  <polygon points="0,0 8,4 0,8" fill="context-stroke"/>
                </marker>
              </defs>
            </svg></div>
          </div>
        </div>
        <footer>
          <span id="status" role="status"></span
          ><button id="reload" hidden>Reload from disk</button>
        </footer>
      </section>
      <div id="aside-handle" role="separator" aria-orientation="vertical" aria-label="Resize source pane" tabindex="0"></div>
      <aside>
        <div id="preview-heading" class="pane-title">
          <h2>Definition preview</h2>
          <a href="/" target="_blank" rel="noopener">Full drawing ↗</a>
        </div>
        <img id="preview" alt="Saved definition preview" hidden />
        <p id="preview-message" hidden></p>
        <div class="pane-title"><h2 id="source-heading">Saved source</h2><button id="reset-story" aria-label="Reset story" title="Restore the original story" hidden>Reset</button></div>
        <div id="source"><pre id="source-text"></pre></div>
      </aside>
    </main>
    <div id="port-tip" role="tooltip" hidden></div>
  </body>
</html>
